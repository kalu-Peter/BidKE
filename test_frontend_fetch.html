<!DOCTYPE html>
<html>
<head>
    <title>Test Admin Endpoints</title>
</head>
<body>
    <h1>Admin Endpoints Test</h1>
    <div id="results"></div>
    
    <script>
        async function testEndpoints() {
            const endpoints = [
                'http://localhost:8000/payments/admin/list_payouts.php?page=1&limit=5',
                'http://localhost:8000/payments/admin/list_payments.php?page=1&limit=5', 
                'http://localhost:8000/payments/admin/list_commissions.php?page=1&limit=5'
            ];
            
            const results = document.getElementById('results');
            
            for (const url of endpoints) {
                try {
                    console.log(`Testing: ${url}`);
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    results.innerHTML += `
                        <div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">
                            <h3>✅ ${url}</h3>
                            <p>Success: ${data.success}</p>
                            <p>Total: ${data.total}</p>
                            <p>Data count: ${data.data?.length || 0}</p>
                        </div>
                    `;
                } catch (error) {
                    results.innerHTML += `
                        <div style="margin: 10px 0; padding: 10px; border: 1px solid red;">
                            <h3>❌ ${url}</h3>
                            <p>Error: ${error.message}</p>
                        </div>
                    `;
                }
            }
        }
        
        // Test when page loads
        window.onload = testEndpoints;
    </script>
</body>
</html>
